name: t3code

services:
  t3code:
    image: ${T3_IMAGE:-t3code:browser}
    build:
      context: .
      target: ${T3_BUILD_TARGET:-browser}
    container_name: t3code
    restart: unless-stopped
    hostname: ${T3_HOSTNAME:-t3code}
    environment:
      # Public address clients reach this server on. `t3-pair` builds its
      # pairing links from this; without it the links point at the container's
      # own bridge address and nothing can use them.
      T3_PUBLIC_URL: ${T3_PUBLIC_URL:-}
      # Match these to the owner of your workspace bind mount.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      T3_ALLOW_SUDO: ${T3_ALLOW_SUDO:-0}
      T3_AUTO_ADD_PROJECTS: ${T3_AUTO_ADD_PROJECTS:-1}
      T3_PRINT_PAIRING_ON_START: ${T3_PRINT_PAIRING_ON_START:-0}
      # What to install onto the volume on first start, in the background:
      # all (the five agents plus Go, Rust, Bun, Deno, uv), agents,
      # toolchains, a list such as claude,codex,go, or none.
      T3_PREINSTALL: ${T3_PREINSTALL:-all}
      T3_PERSIST_AGENT_CREDENTIALS: ${T3_PERSIST_AGENT_CREDENTIALS:-1}
      # Used by the DeepSeek-through-OpenCode example. Keys for the harnesses
      # themselves belong in T3 Code's per-provider-instance environment
      # (Settings > Providers), where they stay isolated per instance and can
      # be marked sensitive - not in a variable every process here inherits.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Password for the setup UI on port 3774, which mints pairing links on
      # demand. Leave empty and one is generated at boot and printed to the log.
      T3_SETUP_KEY: ${T3_SETUP_KEY:-}
      T3_SETUP_ENABLED: ${T3_SETUP_ENABLED:-1}
      # Serve the setup UI under a path prefix, so one public hostname can
      # route e.g. /__setup* here instead of needing a second subdomain.
      T3_SETUP_BASE_PATH: ${T3_SETUP_BASE_PATH:-}
      # Also serve T3 Code and the setup page together on this one port (the
      # setup page under /__setup), for a tunnel, proxy or hosting platform
      # that routes a single port. Publish it in place of the two below.
      T3_SINGLE_PORT: ${T3_SINGLE_PORT:-}
      T3_PAIR_TTL: ${T3_PAIR_TTL:-30d}
    volumes:
      # State, provider credentials, shell history - everything under ~.
      - t3-home:/home/t3
      # Your repositories. Each git checkout directly inside becomes a project.
      - ${T3_WORKSPACE_HOST:-./workspace}:/workspace
    ports:
      # Loopback by default: publishing an unencrypted agent control plane to
      # the internet would hand anyone who finds it a shell. Use the `tls`
      # profile, a tunnel, or a private network instead.
      - "${T3_BIND_ADDR:-127.0.0.1}:${T3_PORT:-3773}:3773"
      # Setup UI. Pairing links are credentials, so it is loopback by default
      # too; publish it only as far as you need to reach it from a browser.
      - "${T3_SETUP_BIND_ADDR:-127.0.0.1}:${T3_SETUP_PORT:-3774}:3774"
    # Chromium needs more than the default 64 MB of shared memory.
    shm_size: ${T3_SHM_SIZE:-1gb}
    stop_grace_period: 30s

  # docker compose --profile tls up -d
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    container_name: t3code-caddy
    restart: unless-stopped
    depends_on:
      - t3code
    environment:
      # A real hostname pointed at this machine; Caddy gets the certificate.
      # Compose interpolates the whole file regardless of active profiles, so
      # this cannot be a required variable - it would break `up` for everyone
      # not using TLS. The localhost fallback gets an internal certificate,
      # which is fine for a local try-out and useless for a phone.
      T3_DOMAIN: ${T3_DOMAIN:-localhost}
    volumes:
      - ./examples/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  t3-home:
  caddy-data:
  caddy-config:
